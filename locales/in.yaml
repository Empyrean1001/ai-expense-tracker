name: India
hints: |
  Regional context: India.
  - Swiggy and Zomato are food delivery services (Food & Dining / Delivery).
  - Blinkit, Zepto, Swiggy Instamart and BigBasket are grocery delivery
    (Food & Dining / Groceries).
  - Ola, Uber and Rapido are ride-hailing (Transport / Ride-hailing).
  - BMTC, KSRTC, DTC, Namma Metro and IRCTC are public transit / rail
    (Transport / Public Transit).
  - Amazon, Flipkart, Myntra and Meesho are online marketplaces (Shopping / Online Marketplace).
  - "UPI/<NAME>/[<bank code>/]<reference>/<note>" descriptions are UPI payments;
    the note is typed by the payer and is the best clue to the purpose
    ("bus", "metro", "cab" = Transport; "lunch", "dinner" = Food & Dining).
  - The note "auto" means an auto-rickshaw ride (Transport / Ride-hailing),
    never an automatic payment. "bike" means a bike taxi (Transport / Ride-hailing).
  - "REV-UPI" is a reversed UPI payment: money returned (Income / Refunds).
  - "Int.Pd" descriptions are bank interest credited (Income / Interest).
  - Jio, Airtel, Vi and BSNL are telecom (Bills & Utilities / Internet/Phone).
